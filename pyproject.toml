[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "education-payroll-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "openpyxl>=3.1", "xlrd>=2.0.1", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
